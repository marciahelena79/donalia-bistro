.cb .tag{font:700 10px "DM Sans",sans-serif;letter-spacing:.14em;color:var(--gold)}

.cb p{margin:0;font-size:clamp(11px,3vw,13px);line-height:1.3;color:#6B6753}
.pr{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--gold);border-radius:99px;padding:4px 16px;font:700 clamp(15px,4.4vw,20px) "Lora",Georgia,serif}
.cb a.q{display:block;width:100%;background:var(--g);color:#fff;text-decoration:none;border-radius:99px;padding:9px 10px;font:700 clamp(12px,3.3vw,14px) "DM Sans",sans-serif}
.b{position:sticky;bottom:0;width:100%;max-width:640px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 40%);text-align:center;margin-top:-8px}
.b a{display:block;background:var(--g);color:#fff;text-decoration:none;border-radius:99px;padding:14px 22px;font-weight:700}
@media (prefers-reduced-motion:reduce){.ct i{animation:none}}
