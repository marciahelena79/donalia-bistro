<div><div class="card"><h3>Meta do mês</h3>${meta?`<p class="k">${R(S.rev)} de ${R(meta)} · faltam ${R(Math.max(0,meta-S.rev))}</p><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div><p class="k">${PC(pct)} atingido. Para fechar a meta: ${R(Math.max(0,meta-S.rev)/rest)} por dia nos ${rest} dias restantes${tk?` (cerca de ${Math.ceil(Math.max(0,meta-S.rev)/tk)} itens no total)`:''}.</p>`:'<p class="k">Defina a meta mensal na aba Custos.</p>'}</div>
<div class="card"><h3>Estimativas</h3><p class="k">Projeção do mês pelo ritmo atual: <b>${R(proj)}</b> (não é garantia de vendas futuras).</p><p class="k">Faturamento de equilíbrio: <b>${be?R(be):'—'}</b>, o que cobre as despesas fixas.</p></div></div></div>
<div class="card"><h3>Despesas fixas mensais</h3><p class="k">Lance só o que não está no custo por item. Vale para todos os meses.</p><div class="sc"><table><tr><th>Despesa</th><th class="r">Valor mensal</th><th></th></tr>${fx.map((x,i)=>`<tr><td><input type="text" style="width:240px" data-is="fixed.${i}.n" value="${esc(x.n)}"></td><td class="r"><input style="width:100px;text-align:right" data-is="fixed.${i}.v" type="number" min="0" step="0.01" value="${x.v||''}" placeholder="0"></td><td><button class="btn s g" data-fa="delf" data-i="${i}" aria-label="Remover">×</button></td></tr>`).join('')}</table></div><p><button class="btn s" data-fa="addf">+ Adicionar despesa</button></p><p class="big">${R(fixed)}</p></div>`}
async function finSave(){const{error}=await sb.from('settings').upsert({key:'fin',value:FIN},{onConflict:'key'});MS(error?error.message:'Salvo ✓',!error)}
function resDraw(){setTimeout(()=>{const a=document.activeElement,s=a&&a.getAttributeNames?a.getAttributeNames().filter(n=>n.startsWith('data-')).map(n=>`[${n}="${a.getAttribute(n)}"]`).join(''):'';RESV();if(s){const e=$('#main '+a.tagName.toLowerCase()+s);if(e){e.focus();try{e.select()}catch(_){}}}},0)}
$('#app').addEventListener('change',async e=>{const t=e.target;if(tab!='res'||!t.dataset||!('fm' in t.dataset||t.dataset.is))return;
if('fm' in t.dataset){if(t.value){FM=t.value;EDV.res()}return}
const p=t.dataset.is,m=p.match(/^fixed\.(\d+)\.(n|v)$/);if(!m)return;const row=FIN.fixed[+m[1]];if(!row)return;
if(m[2]=='v'){const s=t.value.trim().replace(',','.'),v=s===''?0:parseFloat(s);if(!(v>=0)){resDraw();MS('Valor inválido',0);return}row.v=v}else{const v=t.value.trim();if(!v){resDraw();MS('Informe o nome da despesa',0);return}row.n=v}
resDraw();await finSave()});
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-fa]');if(!b||tab!='res')return;const a=b.dataset.fa;
if(a=='addf'){(FIN.fixed=FIN.fixed||[]).push({n:'Nova despesa',v:0});RESV();await finSave()}else if(a=='delf'){FIN.fixed.splice(+b.dataset.i,1);RESV();await finSave()}});

</script></body></html>
